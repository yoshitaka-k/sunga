[package]
name = "sunga"
version = "1.5.1"
edition = "2024"
description = "Image Re Size"
authors = ["yoshitaka-k"]
repository = "yoshitaka-k/sunga"
license = "Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.bundle]
identifier = "jp.ktgwya.sunga"
name = "Sunga"
icon = ["target/bundle-icons/*.png"]
category = "Utility"
short_description = "Image Re Size"
deb_depends = [
    "libgtk-3-0",
    "libxcb-render0",
    "libxcb-shape0",
    "libxcb-xfixes0",
    "libxkbcommon0",
    "libvulkan1",
    "libssl3",
]

[package.metadata.winresource]
ProductName = "Sunga"
FileDescription = "Image Re Size"
OriginalFilename = "Sunga.exe"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.151"
winresource = "0.1.31"
ico = "0.5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winbase"] }

[dependencies]
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg", "image", "file"] }
eframe = { version = "0.36.1", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
getset = "0.1.7"
rfd = "0.17.2"
env_logger = "0.11.11"
log = "0.4.34"
ehttp = { version = "0.7.1", features = ["json"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
rodio = "0.22.2"
