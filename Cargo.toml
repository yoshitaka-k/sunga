[package]
name = "sunga"
version = "0.3.1"
edition = "2024"
description = "Image Re Size"
authors = ["yoshitaka-k"]
repository = "yoshitaka-k/sunga"
license = "Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.151"
winresource = "0.1.31"
ico = "0.5"

[dependencies]
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg", "image", "file"] }
eframe = { version = "0.36.1", features = ["persistence"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
getset = "0.1.7"
rfd = "0.17.2"
env_logger = "0.11.11"
log = "0.4.34"
ehttp = { version = "0.7.1", features = ["json"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
